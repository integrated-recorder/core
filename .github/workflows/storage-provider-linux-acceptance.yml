name: Storage Provider Linux Docker Acceptance

on:
  push:
    branches:
      - diagnostic/storage-provider-linux-acceptance
      - fix/docker-bundled-generation-migration

permissions:
  contents: read

concurrency:
  group: storage-provider-linux-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official-rc9-to-rc10-upgrade:
    name: Official RC9 install and RC10 upgrade
    if: github.ref == 'refs/heads/diagnostic/storage-provider-linux-acceptance'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out diagnostic branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record runner Docker environment
        run: |
          docker version
          docker compose version
          docker info --format '{{.OSType}}/{{.Architecture}}'
      - name: Install official RC9, exercise rollback, retry official RC10
        env:
          IR_RUN_STORAGE_UPGRADE_DOCKER_E2E: '1'
        run: python3 scripts/test_storage_provider_linux_acceptance.py OfficialRC9RC10DockerUpgradeTests.test_official_rc9_install_rc10_upgrade_and_pending_rollback_retry -v

  candidate-image-bundle-upgrade:
    name: RC9 install and candidate image-bundle upgrade
    if: github.ref == 'refs/heads/fix/docker-bundled-generation-migration'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record runner Docker environment
        run: |
          docker version
          docker compose version
          docker info --format '{{.OSType}}/{{.Architecture}}'
      - name: Install Go and compile archive fixture verifier
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile Linux archive fixture test binary
        env:
          CGO_ENABLED: '0'
        run: go test -c -o "${RUNNER_TEMP}/storageprocess-upgrade-fixture.test" ./internal/storageprocess
      - name: Install official RC9 and upgrade to exact diagnostic image candidate
        env:
          IR_RUN_BUNDLE_UPGRADE_DOCKER_E2E: '1'
          IR_DOCKER_ARCHIVE_FIXTURE_BINARY: ${{ runner.temp }}/storageprocess-upgrade-fixture.test
        run: python3 scripts/test_storage_provider_linux_acceptance.py CandidateImageBundleUpgradeDockerTests.test_rc9_image_bundle_migrates_to_candidate_and_resumes_after_verification_retry -v

  diagnostic-image:
    name: Diagnostic image and safe failure stages
    if: github.ref == 'refs/heads/diagnostic/storage-provider-linux-acceptance' || github.ref == 'refs/heads/fix/docker-bundled-generation-migration'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out diagnostic branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Python installer tests
        run: python3 -m unittest discover -s scripts -p 'test_install.py'
      - name: Full short Go and race suites
        run: |
          go test -short -count=1 -timeout=30m ./...
          go test -race -short -count=1 -timeout=30m ./...
          go vet ./...
          go build ./...
      - name: Build and probe diagnostic Docker image
        env:
          IR_RUN_STORAGE_DIAGNOSTIC_DOCKER_E2E: '1'
        run: python3 scripts/test_storage_provider_linux_acceptance.py DiagnosticImageLinuxDockerTests.test_diagnostic_image_normal_provider_and_safe_failure_codes -v
