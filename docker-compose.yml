services:
  archiver:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADDR: ":8080"
      DATA_DIR: /data
      ADAPTER_DIR: /external-adapters
      IR_ALLOW_OPERATOR_PLUGINS: ${IR_ALLOW_OPERATOR_PLUGINS:-0}
      IR_PLUGIN_REGISTRY_URL: ${IR_PLUGIN_REGISTRY_URL:-}
    volumes:
      - recording-data:/data
      - ./adapter-binaries:/external-adapters:ro
    restart: unless-stopped
    stop_grace_period: 45s

volumes:
  recording-data:
